<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Sports Card Tracker</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🃏 Card Tracker</div>
    <nav class="tabs">
      <button class="tab active" data-view="inventory">Inventory</button>
      <button class="tab" data-view="add">+ Add</button>
    </nav>
  </header>

  <main id="app">
    <!-- Dashboard stats -->
    <section id="stats" class="stats"></section>

    <!-- INVENTORY VIEW -->
    <section id="view-inventory" class="view">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search player, set, team, INV id…" />
        <select id="filter-status">
          <option value="">All statuses</option>
          <option value="in_stock">In stock</option>
          <option value="listed">Listed</option>
          <option value="sold">Sold</option>
        </select>
        <a class="btn btn-ghost" href="/api/cards/export.csv">⬇ CSV</a>
      </div>
      <div id="card-list" class="card-grid"></div>
      <p id="empty-inventory" class="empty hidden">No cards yet. Tap <b>+ Add</b> to scan your first card.</p>
    </section>

    <!-- ADD VIEW -->
    <section id="view-add" class="view hidden">
      <div id="capture-step" class="capture">
        <h2>Scan a card</h2>
        <p class="muted">Take a photo of the front and back. Claude will read the details for you.</p>
        <div class="shots">
          <label class="shot" id="front-shot">
            <input type="file" accept="image/*" capture="environment" id="front-input" hidden />
            <span class="shot-label">Front<br /><small>tap to capture</small></span>
          </label>
          <label class="shot" id="back-shot">
            <input type="file" accept="image/*" capture="environment" id="back-input" hidden />
            <span class="shot-label">Back<br /><small>optional</small></span>
          </label>
        </div>
        <button id="scan-btn" class="btn btn-primary" disabled>Read card with Claude</button>
        <p id="scan-msg" class="muted"></p>
      </div>

      <!-- Review form (hidden until extracted) -->
      <form id="review-form" class="review hidden">
        <h2>Review &amp; save</h2>
        <p id="vision-note" class="pill"></p>
        <div class="grid2">
          <label>Player<input name="player" /></label>
          <label>Year<input name="year" /></label>
          <label>Brand<input name="brand" /></label>
          <label>Set<input name="set_name" /></label>
          <label>Card #<input name="card_number" /></label>
          <label>Variation / Parallel<input name="variation" /></label>
          <label>Team<input name="team" /></label>
          <label>Sport<input name="sport" /></label>
          <label>Rookie?
            <select name="is_rookie">
              <option value="">—</option>
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </label>
          <label>Condition<input name="condition" /></label>
          <label>Status
            <select name="status">
              <option value="in_stock">In stock</option>
              <option value="listed">Listed</option>
              <option value="sold">Sold</option>
            </select>
          </label>
          <label>Purchase price ($)<input name="purchase_price" type="number" step="0.01" /></label>
        </div>
        <label class="full">Notes<textarea name="notes" rows="2"></textarea></label>
        <div class="form-actions">
          <button type="button" id="cancel-add" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save to inventory</button>
        </div>
      </form>
    </section>
  </main>

  <!-- Edit modal -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="edit-title">Edit card</h2>
      <form id="edit-form" class="review">
        <div class="grid2">
          <label>Player<input name="player" /></label>
          <label>Year<input name="year" /></label>
          <label>Brand<input name="brand" /></label>
          <label>Set<input name="set_name" /></label>
          <label>Card #<input name="card_number" /></label>
          <label>Variation<input name="variation" /></label>
          <label>Team<input name="team" /></label>
          <label>Sport<input name="sport" /></label>
          <label>Condition<input name="condition" /></label>
          <label>Status
            <select name="status">
              <option value="in_stock">In stock</option>
              <option value="listed">Listed</option>
              <option value="sold">Sold</option>
            </select>
          </label>
          <label>Purchase price ($)<input name="purchase_price" type="number" step="0.01" /></label>
          <label>Sale price ($)<input name="sale_price" type="number" step="0.01" /></label>
        </div>
        <label class="full">Notes<textarea name="notes" rows="2"></textarea></label>
        <div class="form-actions">
          <button type="button" id="delete-card" class="btn btn-danger">Delete</button>
          <span class="spacer"></span>
          <button type="button" id="close-edit" class="btn btn-ghost">Close</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
